name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Build APK with full log
      run: |
        ./gradlew assembleDebug --info --stacktrace 2>&1 | tee build.log
        echo "=== BUILD LOG ==="
        cat build.log

    - name: Check APK output
      run: |
        echo "=== Checking APK folder ==="
        ls -la app/build/outputs/apk/ || echo "APK folder not found"
        find app/build -name "*.apk" || echo "No APK found anywhere"

    - name: Upload APK if exists
      uses: actions/upload-artifact@v4
      with:
        name: Nemesis-APK
        path: app/build/outputs/apk/debug/*.apk
